#!/bin/bash
set -euo pipefail

# Offizielle Versionen/Downloads anpassen, falls du spaeter eine neuere Version willst.
RIDER_VERSION="2026.1.0.1"
DOTNET_SDK_VERSION="8.0.416"
DOCKER_COMPOSE_URL="https://docker-compose.shorts.akirottv.de"


ARCH="$(uname -m)"
TMP_DIR="$(mktemp -d)"

cleanup() {
  [[ -n "${RIDER_MOUNT:-}" ]] && hdiutil detach "$RIDER_MOUNT" >/dev/null 2>&1 || true
  rm -rf "$TMP_DIR"
}
trap cleanup EXIT

echo "======================================"
echo " Admin-Benutzer mit Installationsrechten"
echo "======================================"
read -rp "Bitte Admin-Benutzernamen eingeben: " ADMIN_USER

if ! id "$ADMIN_USER" >/dev/null 2>&1; then
    echo "Benutzer existiert nicht."
    exit 1
fi

echo "Prüfe Admin-Rechte für $ADMIN_USER ..."
if ! dseditgroup -o checkmember -m "$ADMIN_USER" admin | grep -q "yes"; then
    echo "$ADMIN_USER ist kein Administrator."
    exit 1
fi

echo "Bitte Passwort für $ADMIN_USER eingeben:"
sudo -v -u "$ADMIN_USER"

case "$ARCH" in
  arm64)
    DOTNET_URL="https://download.visualstudio.microsoft.com/download/pr/dotnet-sdk-${DOTNET_SDK_VERSION}-osx-arm64.pkg"
    RIDER_URL="https://download.jetbrains.com/rider/JetBrains.Rider-${RIDER_VERSION}-aarch64.dmg"
    ;;
  x86_64)
    DOTNET_URL="https://download.visualstudio.microsoft.com/download/pr/dotnet-sdk-${DOTNET_SDK_VERSION}-osx-x64.pkg"
    RIDER_URL="https://download.jetbrains.com/rider/JetBrains.Rider-${RIDER_VERSION}.dmg"
    ;;
  *)
    echo "Nicht unterstützte Architektur: $ARCH"
    exit 1
    ;;
esac

echo "Lade .NET herunter..."
curl -L "$DOTNET_URL" -o "$TMP_DIR/dotnet.pkg"

echo "Installiere .NET als $ADMIN_USER ..."
sudo -u "$ADMIN_USER" installer -pkg "$TMP_DIR/dotnet.pkg" -target /

echo "Lade Rider herunter..."
curl -L "$RIDER_URL" -o "$TMP_DIR/rider.dmg"

RIDER_MOUNT="$(hdiutil attach "$TMP_DIR/rider.dmg" -nobrowse | awk '/\/Volumes\// {print $NF; exit}')"

APP_SOURCE="$(find "$RIDER_MOUNT" -maxdepth 1 -name "*.app" | head -n 1)"

echo "Installiere Rider ..."
sudo -u "$ADMIN_USER" cp -R "$APP_SOURCE" "/Applications/JetBrains Rider.app"

mkdir -p "$HOME/Documents"
curl -L "$DOCKER_COMPOSE_URL" -o "$HOME/Documents/docker-compose.yml"

echo "Installation abgeschlossen."